name: build-dmg

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: "签名并公证 (需已配置证书/公证 secrets)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller pillow tkinterdnd2
          brew install create-dmg || true

      - name: Inject tools (optional)
        env:
          HAP_TOOLS_URL: ${{ secrets.HAP_TOOLS_URL }}
          HAP_TOOLS_B64: ${{ secrets.HAP_TOOLS_B64 }}
        run: |
          mkdir -p packaging/tools
          if [ -n "$HAP_TOOLS_URL" ]; then
            echo "从 HAP_TOOLS_URL 下载工具..."
            curl -fsSL "$HAP_TOOLS_URL" | tar -xzf - -C packaging/tools
          elif [ -n "$HAP_TOOLS_B64" ]; then
            echo "$HAP_TOOLS_B64" | base64 --decode | tar -xzf - -C packaging/tools
          else
            echo "::warning title=缺少工具::未配置 secrets.HAP_TOOLS_URL/B64，dmg 不含内置 hdc/signer/key.pem"
          fi

      - name: Build dmg (未签名)
        run: |
          chmod +x packaging/*.sh
          PY=python3 ./packaging/build_dmg.sh

      - name: Check notarize availability
        id: notary
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_B64 }}
          WANT: ${{ inputs.notarize }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$CERT" ] && { [ "$WANT" = "true" ] || [ "${REF#refs/tags/}" != "$REF" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign & notarize (可选, 默认关闭)
        if: steps.notary.outputs.enabled == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
          CERT_PWD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PWD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -e
          KC=build.keychain
          echo "$CERT_B64" | base64 --decode > cert.p12
          security create-keychain -p "$KC_PWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PWD" "$KC"
          security import cert.p12 -k "$KC" -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KC_PWD" "$KC" >/dev/null
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')
          echo "identity: $IDENTITY"
          [ -n "$IDENTITY" ] || { echo "未找到 Developer ID Application 证书"; exit 1; }
          xcrun notarytool store-credentials hap-notary \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PWD"
          chmod +x packaging/sign_notarize.sh
          ./packaging/sign_notarize.sh --identity "$IDENTITY" --profile hap-notary

      - name: Rename artifact
        run: |
          cp "packaging/HAP调试助手.dmg" "packaging/HAP-debug-tool.dmg"
          ls -la packaging/*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAP-debug-tool-dmg
          path: packaging/HAP-debug-tool.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/HAP-debug-tool.dmg
